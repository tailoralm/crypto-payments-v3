name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptopay
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: cryptopay_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cryptopay" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_NAME: cryptopay_test
      DB_USER: cryptopay
      DB_PASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/setup.mjs
      - run: docker compose up --build -d --wait
        env:
          DISABLE_POLLER: 'true'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          set -a
          . ./.env
          set +a
          export E2E_SETUP_TOKEN="$SETUP_TOKEN"
          export E2E_BASE_URL=http://127.0.0.1:8080
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            frontend/test-results/
      - run: docker compose down
        if: always()

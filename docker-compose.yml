services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cryptopay}
      POSTGRES_USER: ${DB_USER:-cryptopay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env with node scripts/setup.mjs}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_NAME: ${DB_NAME:-cryptopay}
      DB_USER: ${DB_USER:-cryptopay}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Generate .env first}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate .env first}
      SETUP_TOKEN: ${SETUP_TOKEN:?Generate .env first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: 1
      DISABLE_POLLER: ${DISABLE_POLLER:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  db_data:

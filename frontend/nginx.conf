server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_hide_header Content-Security-Policy;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Only this listener is used by cloudflared. It has no administrative fallback.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    merge_slashes off;
    client_max_body_size 32k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Refuse normalization ambiguities before matching decoded locations.
    if ($request_uri ~ "^[^?]*(%|\\\\|//|/\\.)") { return 404; }
    location ~ "^/bill/[a-f0-9]{64}$" {
        limit_except GET HEAD { deny all; }
        try_files /index.html =404;
    }
    location ~ "^/(?:[A-Za-z0-9_-]+\.(?:js|css)|favicon\.ico)$" {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location ~ "^/api/(?:billing/[a-f0-9]{64}(?:/pdf)?|public-ready)$" {
        limit_except GET HEAD { deny all; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Content-Security-Policy;
    }
    location ~ "^/api/api/v1/payments(?:/[a-fA-F0-9-]{36}(?:/(?:publish|revoke))?)?$" {
        limit_except GET HEAD POST { deny all; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Content-Security-Policy;
    }
    location / { return 404; }
}
